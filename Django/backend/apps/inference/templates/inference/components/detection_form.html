<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h2 class="h5 mb-3">Analyze Text</h2>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-lg-4">
                    <label for="id_model" class="form-label">Model</label>
                    <select id="id_model" class="form-select" name="model">
                        {% for model_name in model_choices %}
                            <option value="{{ model_name }}" {% if selected_model == model_name %}selected{% endif %}>{{ model_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-lg-8">
                    <label for="id_text" class="form-label">Input text</label>
                    <textarea id="id_text" class="form-control" name="text" rows="6" placeholder="Paste your text here for bot detection analysis...">{{ input_text }}</textarea>
                </div>
            </div>

            <div class="mt-3 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">Analyze</button>
            </div>
        </form>
    </div>
</div>
