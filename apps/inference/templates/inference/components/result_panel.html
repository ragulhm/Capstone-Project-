{% if result %}
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Results</h2>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="metric-card">
                        <div class="metric-label">Prediction Score</div>
                        <div class="metric-value">{{ result.prediction|floatformat:4 }}</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="metric-card">
                        <div class="metric-label">Classification</div>
                        <div class="metric-value {% if result.is_bot %}text-danger{% else %}text-success{% endif %}">
                            {% if result.is_bot %}Bot{% else %}Human{% endif %}
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="metric-card">
                        <div class="metric-label">Model Used</div>
                        <div class="metric-value">{{ result.model }}</div>
                    </div>
                </div>
            </div>

            <label class="form-label">Confidence Gauge</label>
            <div class="progress" role="progressbar" aria-label="Confidence Gauge" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ result.prediction|floatformat:0 }}">
                <div
                    class="progress-bar {% if result.is_bot %}bg-danger{% else %}bg-success{% endif %}"
                    style="width: {% widthratio result.prediction 1 100 %}%"
                >
                    {{ result.prediction|floatformat:2 }}
                </div>
            </div>
            <div class="small text-muted mt-2">
                Human {{ result.prediction|floatformat:1 }}% Bot
            </div>
        </div>
    </div>
{% endif %}
